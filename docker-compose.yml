version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repomind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-repomind}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-repomind}
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-repomind} -d repomind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repomind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/repomind
      DATABASE_USERNAME: ${DATABASE_USERNAME:-repomind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-repomind}
      JWT_SECRET: ${JWT_SECRET:-repomind-production-super-secret-key-change-in-production-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_REPO_PATH: /demo-repository/demo-shop
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./demo-repository:/demo-repository:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repomind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
    driver: local
