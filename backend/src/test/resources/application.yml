server:
  port: 8001

spring:
  datasource:
    url: jdbc:h2:mem:repomindtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

repomind:
  jwt:
    secret: repomind-test-jwt-secret-key-that-is-long-enough-for-hs256-signing
    expiration-ms: 3600000
  ai:
    demo-mode: true
  demo:
    repo-path: ../demo-repository/demo-shop
